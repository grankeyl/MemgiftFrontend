# /etc/nginx/conf.d/default.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Включим gzip в рамках этого server (без глобальных дубликатов)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        application/manifest+json application/xml text/xml
        image/svg+xml font/ttf font/otf application/vnd.ms-fontobject
        application/font-woff application/font-woff2;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
        # HTML не кэшируем надолго
        add_header Cache-Control "no-cache" always;
    }

    # Долгое кэширование ассетов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|otf|svg|mp4|webm)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Прокси на API — не localhost, а имя docker-сервиса

}