<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#1C1C1C">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Memgift - Mini App</title>

    <link rel="stylesheet" href="/src/assets/styles/fonts.css">

    <!-- GA: сначала подключаем библиотеку, потом config -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CJMFXZXVHZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-CJMFXZXVHZ');
    </script>

    <!-- Telegram SDK: defer, чтобы не блокировать парсинг -->
    <script src="https://telegram.org/js/telegram-web-app.js?56" defer></script>

    <script>
      // безопасная инициализация Telegram WebApp после загрузки DOM и SDK
      function initWebAppSafe() {
        const wa = window?.Telegram?.WebApp;
        if (!wa) return;                        // SDK ещё не готов — просто выходим
        try {
          wa.expand?.();
          const allowFs = Number(wa.version || 0) >= 8
            && typeof wa.requestFullscreen === 'function'
            && ['ios','android'].includes(wa.platform);
          if (allowFs) wa.requestFullscreen();
          wa.disableVerticalSwipes?.();
        } catch (e) { console.debug('TG init skipped:', e); }
      }

      // Инициализируем после DOM, а также после загрузки TG SDK
      document.addEventListener('DOMContentLoaded', initWebAppSafe);
      window.addEventListener('load', initWebAppSafe);
    </script>

    <script>
      // Полайфилл для View Transitions — не мешаем первому рендеру
      try {
        const orig = document.startViewTransition;
        if (orig) {
          document.startViewTransition = (cb) => {
            const t = orig.call(document, cb);
            t.finished.then(() => document.body.removeAttribute('data-transition'));
            return t;
          };
        }
      } catch (e) { console.debug('VT setup failed:', e); }
    </script>

    <style> html { background:#1C1C1C; } </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- ВАЖНО: модульный бандл монтирует Vue в #app -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
